name: Deploy to GitHub Pages

# GitHub Pages へのデプロイ(このリポジトリの公開先)。
# ベースパスはリポジトリ名から自動で決まるので、リポジトリを
# リネーム・フォークしてもこのファイルはそのまま使える。
#
# NOINDEX: 'true' の間は検索エンジンに載せない(既存の本番
# ポートフォリオ https://tomoki-arai.vercel.app/ と検索結果で
# 競合させないため)。このサイトを正式な公開先に切り替えるときは
# NOINDEX を 'false' にすること。

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1本に制限(進行中のデプロイはキャンセルしない)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          # base を '/<リポジトリ名>/' に切り替える
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          # Pages は静的配信のため、問い合わせは既存 Vercel の API へ転送する
          VITE_CONTACT_API_BASE: https://tomoki-arai.vercel.app
          # 既存ポートフォリオと検索結果で競合しないよう、当面 noindex にする
          NOINDEX: 'true'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
