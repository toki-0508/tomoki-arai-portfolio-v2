name: Deploy redirect to GitHub Pages

# 本番は Vercel(https://tomoki-arai.vercel.app/)。main への push で Vercel が自動デプロイする。
#
# このワークフローは、以前このリポジトリの GitHub Pages で公開していた URL
# (https://toki-0508.github.io/tomoki-arai-portfolio-v2/)を本番 URL へ転送するページだけを配信する。
# 古いリンクや検索結果から来た人を本番へ案内するためのもので、サイト本体はここでは公開しない。

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
