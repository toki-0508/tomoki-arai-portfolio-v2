<!doctype html>
<!-- OG 画像(public/og-image.png)の型。README の「OG 画像の作り直し」を参照 -->
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f4f5f9;color:#161b2e;font-family:'Zen Kaku Gothic New',sans-serif}
  .og{position:relative;display:grid;grid-template-columns:700px 1fr;height:100%}
  .copy{display:flex;flex-direction:column;justify-content:center;padding:0 0 0 84px}
  .eyebrow{font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.16em;color:#3046d1}
  h1{margin:30px 0 0;font-size:58px;line-height:1.38;font-weight:700;letter-spacing:.02em;font-feature-settings:'palt' 1}
  h1 > span{display:block;white-space:nowrap}
  .ink{position:relative;display:inline-block}
  .ink svg{position:absolute;left:-6%;width:112%;bottom:2px;overflow:visible}
  .ink path{fill:none;stroke:#3046d1;stroke-width:3.4;stroke-linecap:round}
  .name{margin-top:40px;font-size:26px;font-weight:700;letter-spacing:.1em}
  .name small{margin-left:14px;font-size:18px;font-weight:500;color:#565e73;letter-spacing:.12em}
  .url{margin-top:10px;font-family:'DM Mono',monospace;font-size:18px;color:#565e73;letter-spacing:.04em}
  .visual{display:flex;align-items:center;justify-content:center;padding-right:30px}
  .visual img{width:520px;height:auto}
  .bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#161b2e}
</style></head><body>
<div class="og">
  <div class="copy">
    <div class="eyebrow">TOMOKI ARAI · APP / 3D / ELECTRONICS</div>
    <h1><span>身の回りを、</span><span>ちょっと<span class="ink">好き<svg viewBox="0 0 120 16"><path d="M3 10.5C26 6 52 12.5 78 8.5S108 6 117 7"/></svg></span>になる。</span></h1>
    <div class="name">新井智己<small>あらいともき</small></div>
    <div class="url">tomoki-arai.vercel.app</div>
  </div>
  <div class="visual"><img src="hero.png" alt=""></div>
  <div class="bar"></div>
</div>
</body></html>
